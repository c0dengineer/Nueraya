<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Child Profile | Neuraya</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height:100vh; background:linear-gradient(135deg,#eef2ff,#f8f9ff); font-family:'Segoe UI',sans-serif; }
    .page { max-width:850px; margin:auto; padding:48px 20px; }
    .card { border:0; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,.08); }
    .form-control,.form-select { padding:12px; border-radius:10px; }
    .radio-box { display:inline-block; padding:10px 15px; margin:4px 8px 4px 0; border:1px solid #e5e7eb; border-radius:10px; background:#fafafa; }
    .save { background:#2563eb; border:0; border-radius:10px; padding:12px 26px; font-weight:600; }
  </style>
</head>
<body>
  <main class="page">
    <a href="dashboard.html" class="text-decoration-none" onclick="return goBackFromChild()">← Back to dashboard</a>
    <div class="card mt-3"><div class="card-body p-4 p-md-5">
      <p class="text-primary fw-semibold mb-1">PARENT DASHBOARD</p>
      <h1 class="main-title h2">Edit Child Information</h1>
      <p class="text-muted">Update this child’s profile. Existing screening history is kept.</p>
      <form onsubmit="goNextStep(); return false;" novalidate>
        <div class="row"><div class="col-md-6 mb-3"><label class="form-label">Child's name</label><input id="childName" class="form-control" required></div>
        <div class="col-md-6 mb-3"><label class="form-label">Date of birth</label><input id="childDOB" type="date" class="form-control" required></div></div>
        <div class="mb-3"><label class="form-label d-block">Gender</label>
          <label class="radio-box"><input type="radio" name="gender" value="Male"> Male</label><label class="radio-box"><input type="radio" name="gender" value="Female"> Female</label><label class="radio-box"><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <div class="mb-3"><label class="form-label d-block">Family history of ASD</label>
          <label class="radio-box"><input type="radio" name="asd" value="Yes"> Yes</label><label class="radio-box"><input type="radio" name="asd" value="No"> No</label>
        </div>
        <div class="mb-4"><label class="form-label">Your relationship to child</label><select id="relationship" class="form-select" required><option value="">Select relationship</option><option>Mother</option><option>Father</option><option>Guardian</option><option>Sibling</option><option>Teacher</option><option>Doctor</option></select></div>
        <div class="form-check p-3 border rounded mb-4 bg-light"><input class="form-check-input ms-0 me-2" type="checkbox" id="screeningConsent"><label class="form-check-label" for="screeningConsent">I confirm these details are accurate to the best of my knowledge.</label></div>
        <div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="dashboard.html">Cancel</a><button class="btn btn-primary save continue-btn" type="submit">Save Changes</button></div>
      </form>
    </div></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
